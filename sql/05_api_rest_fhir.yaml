# SNCEV — Especificación de API REST + FHIR R4
# Sistema Nacional de Cartilla Electrónica de Vacunación
# Versión: 1.0 | Base URL: https://api.sncev.salud.gob.mx/v1
# Seguridad: OAuth 2.0 + JWT (Bearer) | TLS 1.3 obligatorio

openapi: "3.1.0"
info:
  title: SNCEV API
  version: "1.0.0"
  description: |
    API central del Sistema Nacional de Cartilla Electrónica de Vacunación.
    Cubre registro de pacientes, vacunación, datos clínicos, gestión de usuarios,
    reportes de cobertura e interoperabilidad HL7 FHIR R4.

servers:
  - url: https://api.sncev.salud.gob.mx/v1
    description: Producción
  - url: https://api-dev.sncev.salud.gob.mx/v1
    description: Desarrollo / QA

# =============================================================================
# SEGURIDAD GLOBAL
# =============================================================================
# Todos los endpoints requieren:
#   Authorization: Bearer <JWT>
# Excepciones indicadas con [PUBLIC] o [ANON]
#
# Los JWT incluyen claims:
#   sub:          UUID del usuario
#   rol:          nombre del rol
#   nivel:        nivel de acceso (1-6)
#   unidad_id:    UUID de la unidad médica (si aplica)
#   jurisdiccion: ID de jurisdicción (si aplica)
#   estado:       clave de estado (si aplica)
#   permisos:     array de códigos de permiso
#   exp:          Unix timestamp de expiración (15 min)
# =============================================================================

# =============================================================================
# MÓDULO 1 — AUTENTICACIÓN Y SESIONES
# =============================================================================

POST /auth/login
  # [ANON] Inicio de sesión
  # Requiere: username, password
  # Responde: access_token (JWT 15min), refresh_token (opaco, 8 días), mfa_requerido
  body:
    username:     string  # o email
    password:     string
    device_id:    string? # para App móvil
  response 200:
    access_token:   string  # JWT firmado RS256
    token_type:     "Bearer"
    expires_in:     900     # segundos
    refresh_token:  string  # opaco, rotatorio
    mfa_requerido:  boolean
  response 401:
    error: "Credenciales inválidas"
  response 423:
    error: "Cuenta bloqueada"
    desbloqueada_at: datetime
  # Audita: LOGIN_FALLIDO si falla, LOGIN si OK

POST /auth/mfa/verify
  # Verificar código TOTP (MFA)
  body:
    session_token:  string  # token temporal post-login
    codigo_totp:    string  # 6 dígitos
  response 200:
    access_token:   string
    refresh_token:  string

POST /auth/refresh
  # Renovar access_token con refresh_token (rotación automática)
  # [ANON] — el refresh_token es la credencial
  body:
    refresh_token:  string
  response 200:
    access_token:   string
    refresh_token:  string  # nuevo token (el anterior queda revocado)
  response 401:
    error: "Token revocado o expirado"
  # Detección de reutilización: si el token ya fue revocado,
  # revocar toda la familia de tokens (posible robo)

POST /auth/logout
  # Revocar el refresh token activo
  body:
    refresh_token: string
  response 204: # Sin contenido

POST /auth/logout-all
  # Revocar TODOS los refresh tokens del usuario (cerrar todas las sesiones)
  response 204:

POST /auth/change-password
  body:
    password_actual:  string
    password_nuevo:   string   # min 12 chars, mayúscula, número, especial
    password_confirm: string
  response 204:

POST /auth/forgot-password
  # [ANON] Solicitar restablecimiento por email
  body:
    email: string
  response 202: # Siempre 202 (no revelar si el email existe)

POST /auth/reset-password
  # [ANON] Establecer nueva contraseña con token
  body:
    token:            string
    password_nuevo:   string
    password_confirm: string
  response 204:

# =============================================================================
# MÓDULO 2 — PACIENTES
# Permiso requerido: PACIENTE_VER (lectura), PACIENTE_CREAR (escritura)
# Datos sensibles solo con: PACIENTE_DATOS_SENSIBLES
# =============================================================================

GET /pacientes
  # Lista de pacientes (paginada, filtrable)
  # RLS: solo los de la unidad/jurisdicción/estado del usuario
  query:
    q:              string?   # búsqueda por CURP hash o nombre parcial (trigram)
    curp:           string?   # búsqueda exacta por CURP (se hashea en servidor)
    tipo_cartilla:  int?
    fecha_nac_desde: date?
    fecha_nac_hasta: date?
    municipio_id:   int?
    activo:         bool?     # default true
    page:           int       # default 1
    per_page:       int       # default 20, max 100
  response 200:
    data:     [PacienteResumen]   # sin datos cifrados (solo ID, tipo, fecha_nac, sexo)
    total:    int
    page:     int
    pages:    int

GET /pacientes/{id}
  # Detalle del paciente
  # Con PACIENTE_DATOS_SENSIBLES: incluye nombre, CURP descifrado
  response 200:
    id:                   uuid
    tipo_cartilla:        { id, nombre }
    fecha_nacimiento:     date
    sexo:                 string
    pais_nacimiento:      string
    municipio_nacimiento: { id, nombre, estado }
    grupo_etnico:         string?
    unidad_med_registro:  { id, clues, nombre }
    fhir_patient_id:      string?
    # Solo si PACIENTE_DATOS_SENSIBLES:
    nombre:               string?
    ap_paterno:           string?
    ap_materno:           string?
    curp:                 string?
    created_at:           datetime
    updated_at:           datetime

POST /pacientes
  # Crear nuevo paciente — PACIENTE_CREAR
  body:
    tipo_cartilla_id:         int       # required
    nombre:                   string    # required — se cifra
    ap_paterno:               string    # required — se cifra
    ap_materno:               string?
    curp:                     string?   # se hashea + cifra
    fecha_nacimiento:         date      # required
    sexo:                     "M"|"F"|"I"  # required
    municipio_nacimiento_id:  int?
    estado_nacimiento:        string?
    pais_nacimiento:          string    # default "MEX"
    grupo_etnico:             string?
    lengua_indigena:          string?
    habla_espanol:            bool?
    unidad_med_registro_id:   uuid?
    nss_imss:                 string?   # se cifra
    responsable:              ResponsableInput?   # crear al mismo tiempo
  response 201:
    id:     uuid
    # Audita: INSERT en paciente

PATCH /pacientes/{id}
  # Modificar datos del paciente — PACIENTE_EDITAR
  # Solo campos enviados se actualizan (PATCH semántico)
  body:
    tipo_cartilla_id:         int?
    municipio_nacimiento_id:  int?
    grupo_etnico:             string?
    lengua_indigena:          string?
    habla_espanol:            bool?
    unidad_med_registro_id:   uuid?
    # Datos cifrados (requieren PACIENTE_DATOS_SENSIBLES + PACIENTE_EDITAR):
    nombre:                   string?
    ap_paterno:               string?
    ap_materno:               string?
    curp:                     string?
  response 200:
    id:   uuid

DELETE /pacientes/{id}
  # Baja lógica — PACIENTE_DESACTIVAR
  response 204:

# Responsables
GET  /pacientes/{id}/responsables
POST /pacientes/{id}/responsables
  body:
    nombre:       string  # required
    ap_paterno:   string  # required
    ap_materno:   string?
    curp:         string?
    parentesco:   string  # required
    telefono:     string?
    telefono2:    string?
    email:        string?
    domicilio_calle:  string?
    municipio_id: int?
    cp:           string?
    es_principal: bool    # default true

PATCH /pacientes/{pid}/responsables/{rid}
DELETE /pacientes/{pid}/responsables/{rid}

# =============================================================================
# MÓDULO 3 — VACUNACIÓN
# Permisos: VACUNA_VER, VACUNA_APLICAR, VACUNA_EDITAR, VACUNA_INVALIDAR
# =============================================================================

GET /pacientes/{id}/vacunas
  # Historial completo de vacunación del paciente
  response 200:
    aplicadas:    [VacunaAplicada]
    pendientes:   [VacunaPendiente]  # desde vista v_vacunas_pendientes
    esquema:      EsquemaResumen

GET /pacientes/{id}/vacunas/pendientes
  # Solo vacunas que faltan según esquema y edad actual
  response 200:
    [
      esquema_id:       int
      vacuna:           { id, clave_censia, nombre_generico }
      numero_dosis:     int
      serie:            string
      fecha_optima:     date
      fecha_limite:     date?
      dias_para_optima: int
      vencida:          bool
    ]

POST /pacientes/{id}/vacunas
  # Registrar dosis aplicada — VACUNA_APLICAR
  body:
    vacuna_id:              int       # required
    esquema_id:             int?
    numero_dosis:           int       # required
    serie:                  string?
    fecha_aplicacion:       date      # required
    lote:                   string?
    fecha_caducidad_lote:   date?
    laboratorio:            string?
    temperatura_cadena:     decimal?
    unidad_medica_id:       uuid?     # default: la del usuario logueado
    nombre_aplicador:       string?
    cedula_profesional:     string?
    observaciones:          string?
  response 201:
    id:             uuid
    paciente_id:    uuid
    vacuna:         { id, clave_censia, nombre_generico }
    fecha_aplicacion: date
    edad_dias_aplicacion: int
    # Audita: INSERT en vacuna_aplicada

GET  /vacunas/{id}
PATCH /vacunas/{id}
  # Corregir registro — VACUNA_EDITAR
  # Solo lote, laboratorio, observaciones (fecha y paciente son inmutables)
  body:
    lote:           string?
    laboratorio:    string?
    observaciones:  string?
  # Audita: UPDATE

POST /vacunas/{id}/invalidar
  # Marcar como inválida — VACUNA_INVALIDAR
  body:
    motivo: string  # required
  response 200:
    id:           uuid
    es_valida:    false
    motivo_invalidacion: string
  # Audita: UPDATE

# =============================================================================
# MÓDULO 4 — DATOS CLÍNICOS
# Permiso: CLINICO_VER, CLINICO_TAMIZ_CREAR, CLINICO_SOMATO_CREAR, etc.
# =============================================================================

# Tamizajes neonatales
GET  /pacientes/{id}/tamizajes
POST /pacientes/{id}/tamizajes
  body:
    tipo_tamiz:       string    # "Metabólico"|"Auditivo"|"Cardiaco"|"Oftalmológico"|"Caderas"
    fecha_toma:       date
    numero_muestra:   int       # 1-3
    resultado:        string    # "Normal"|"Anormal"|"Pendiente"
    detalle_resultado: string?
    fecha_resultado:  date?
    requiere_seguimiento: bool
    observaciones:    string?
    unidad_medica_id: uuid?
  response 201: { id: uuid }

PATCH /tamizajes/{id}
  body:
    resultado:          string?
    detalle_resultado:  string?
    fecha_resultado:    date?
    requiere_seguimiento: bool?
    observaciones:      string?

# Somatometría
GET  /pacientes/{id}/somatometria
POST /pacientes/{id}/somatometria
  body:
    fecha_medicion:   date      # required
    edad_dias:        int?
    peso_kg:          decimal?
    talla_cm:         decimal?
    pc_cm:            decimal?
    pt_cm:            decimal?
    percentil_peso:   string?
    percentil_talla:  string?
    percentil_imc:    string?
    clasificacion_nutricional: string?
    observaciones:    string?
  response 201:
    id:   uuid
    imc:  decimal   # calculado por BD

# Desarrollo infantil
GET  /pacientes/{id}/desarrollo
POST /pacientes/{id}/desarrollo
  body:
    fecha_evaluacion:         date
    area:                     "Motor grueso"|"Motor fino"|"Lenguaje"|"Social"|"Cognitivo"
    resultado:                "Adecuado"|"Riesgo"|"Retraso"|"No evaluado"
    habilidades_logradas:     string[]?
    habilidades_pendientes:   string[]?
    observaciones:            string?

# Cartilla completa (todos los módulos en un solo response)
GET /pacientes/{id}/cartilla
  # Responde con la cartilla electrónica completa del paciente
  # Requiere: CARTILLA_VER_COMPLETA
  response 200:
    paciente:     PacienteDetalle
    responsable:  ResponsableDetalle?
    vacunas:      { aplicadas: [], pendientes: [] }
    tamizajes:    []
    somatometria: []
    desarrollo:   []
    firma:        CartillaFirmada?

# =============================================================================
# MÓDULO 5 — CARTILLA DIGITAL Y FIRMA
# Permiso: CARTILLA_GENERAR
# =============================================================================

POST /pacientes/{id}/cartilla/generar
  # Genera PDF, calcula hash SHA-256, firma con RSA del profesional, guarda
  # Requiere: CARTILLA_GENERAR
  body:
    incluir_secciones: string[]?  # default: todas
    # ["vacunas","tamizajes","somatometria","desarrollo"]
  response 201:
    id:           uuid
    hash_sha256:  string
    url_pdf:      string    # URL temporal firmada (S3 pre-signed, 1h)
    url_qr:       string    # URL del QR público
    qr_token:     uuid
    fecha_firma:  datetime

GET /cartilla/verificar/{qr_token}
  # [PUBLIC] Verificación pública por QR — no requiere autenticación
  # Devuelve solo datos no sensibles (nombre sin apellidos no, solo validez)
  response 200:
    valida:           bool
    fecha_firma:      datetime
    tipo_cartilla:    string
    estado_emision:   string   # "Jalisco"
    qr_version:       string
  response 404:
    error: "QR no encontrado"

# =============================================================================
# MÓDULO 6 — CITAS DE VACUNACIÓN
# Permisos: CITA_VER, CITA_CREAR, CITA_EDITAR
# =============================================================================

GET /citas
  # Lista de citas con filtros
  query:
    paciente_id:        uuid?
    unidad_medica_id:   uuid?
    estado:             string?
    fecha_desde:        date?
    fecha_hasta:        date?
    page: int  per_page: int
  response 200:
    data:   [CitaResumen]
    total:  int

GET  /citas/{id}
POST /citas
  body:
    paciente_id:      uuid    # required
    unidad_medica_id: uuid    # required
    vacuna_id:        int?
    esquema_id:       int?
    fecha_programada: datetime # required
    recordatorio_sms: bool    # default false
    recordatorio_push: bool   # default false
    notas:            string?
  response 201: { id: uuid }

PATCH /citas/{id}
  body:
    fecha_programada:   datetime?
    estado:             string?
    motivo_cancelacion: string?
    fecha_real:         date?
    vacuna_aplicada_id: uuid?     # vincular con dosis registrada

DELETE /citas/{id}
  # Cancelar cita (baja lógica con motivo)
  body:
    motivo: string
  response 204:

# =============================================================================
# MÓDULO 7 — CATÁLOGOS
# Permiso: CATALOGO_VER (lectura), CATALOGO_EDITAR (escritura)
# =============================================================================

GET /catalogo/vacunas
  query:
    tipo_cartilla_id: int?
    activo:           bool?   # default true
  response 200:
    [{ id, clave_censia, nombre_generico, nombre_comercial, via_administracion,
       tipo_vacuna, enfermedades, fhir_cvx_code, activo }]

GET /catalogo/vacunas/{id}
GET /catalogo/vacunas/{id}/esquemas
  # Esquemas de vacunación que usan esta vacuna (por tipo de cartilla)

GET /catalogo/esquemas
  query:
    tipo_cartilla_id: int?
    vacuna_id:        int?

GET /catalogo/tipos-cartilla
GET /catalogo/unidades-medicas
  query:
    estado:         string?
    municipio_id:   int?
    jurisdiccion_id: int?
    tipo:           string?
    q:              string?   # búsqueda por nombre o CLUES
    lat:            decimal?  # para búsqueda por proximidad
    lng:            decimal?
    radio_km:       int?      # default 20

GET /catalogo/unidades-medicas/{id}
GET /catalogo/jurisdicciones
  query:
    estado: string?
GET /catalogo/estados
GET /catalogo/municipios
  query:
    estado: string?

# =============================================================================
# MÓDULO 8 — REPORTES Y COBERTURAS (App 2)
# Permisos: REPORTE_COBERTURA_VER, REPORTE_EXPORTAR, REPORTE_NACIONAL_VER
# =============================================================================

GET /reportes/cobertura
  # Cobertura de vacunación agregada con múltiples dimensiones
  query:
    vacuna_id:        int?
    numero_dosis:     int?
    tipo_cartilla_id: int?
    ageb_clave:       string?
    municipio_id:     int?
    jurisdiccion_id:  int?
    estado_clave:     string?
    anio:             int     # required
    semana_desde:     int?    # default 1
    semana_hasta:     int?    # default semana actual
    dimension:        string  # "ageb"|"municipio"|"jurisdiccion"|"estado"|"nacional"
  response 200:
    periodo:          { anio, semana_desde, semana_hasta }
    dimension:        string
    datos:
      [
        dimension_id:       string
        dimension_nombre:   string
        vacuna:             { clave_censia, nombre_generico }
        numero_dosis:       int
        dosis_aplicadas:    int
        poblacion_objetivo: int
        cobertura_pct:      decimal
        concordancia_pct:   decimal
        dosis_invalidas:    int
      ]
    meta_nacional_pct: decimal   # desde parametro_sistema

GET /reportes/cobertura/tendencia
  # Serie temporal de cobertura (para gráfica de línea)
  query:
    vacuna_id:        int     # required
    numero_dosis:     int?
    estado_clave:     string?
    municipio_id:     int?
    anio_desde:       int     # required
    anio_hasta:       int     # required
  response 200:
    [{ anio, semana, dosis_aplicadas, poblacion_objetivo, cobertura_pct }]

GET /reportes/cobertura/mapa
  # Datos de cobertura enriquecidos con geometría WKT para mapas
  query:
    vacuna_id:    int     # required
    numero_dosis: int?
    anio:         int     # required
    semana:       int?
    estado_clave: string? # required para nivel municipio/ageb
    nivel:        string  # "estado"|"municipio"|"ageb"
  response 200:
    [{ clave, nombre, cobertura_pct, geom_wkt, alerta: bool }]

GET /reportes/lotes
  # Trazabilidad de lotes (cadena de frío)
  query:
    lote:         string  # required
    vacuna_id:    int?
  response 200:
    lote:         string
    vacuna:       { clave_censia, nombre_generico }
    total_dosis:  int
    unidades:     [{ clues, nombre, municipio, estado, dosis_aplicadas }]
    fecha_primera: date
    fecha_ultima:  date
    alertas:       int   # dosis con temperatura fuera de rango

GET /reportes/rezago
  # Pacientes con vacunas vencidas o en riesgo (concordancia < umbral)
  # Requiere REPORTE_COBERTURA_VER + restricción por ámbito del usuario
  query:
    tipo_cartilla_id: int?
    vacuna_id:        int?
    municipio_id:     int?
    dias_rezago:      int?   # días desde fecha_limite, default 0
    page: int  per_page: int
  response 200:
    data:
      [{ paciente_id, fecha_nacimiento, vacuna, serie, fecha_limite, dias_rezago,
         unidad_registro, municipio }]
    total: int

POST /reportes/exportar
  # Exportar datos a CSV o XLSX — REPORTE_EXPORTAR
  # Job asíncrono: devuelve job_id, se descarga cuando termine
  body:
    tipo:           "cobertura"|"vacunas_aplicadas"|"rezago"|"auditoria"
    formato:        "csv"|"xlsx"
    filtros:        object    # mismo formato que el endpoint de reporte
    incluir_datos_sensibles: bool  # requiere PACIENTE_DATOS_SENSIBLES
  response 202:
    job_id:     uuid
    estado:     "procesando"

GET /reportes/exportar/{job_id}
  # Consultar estado del job de exportación
  response 200:
    job_id:     uuid
    estado:     "procesando"|"listo"|"error"
    url:        string?     # URL temporal cuando estado=listo (expira 1h)
    error:      string?

# =============================================================================
# MÓDULO 9 — USUARIOS Y ADMINISTRACIÓN
# Permisos: USUARIO_VER, USUARIO_CREAR, USUARIO_EDITAR, USUARIO_ROLES_ASIGNAR
