    unidad_medica_id: uuid?
    jurisdiccion_id:  int?
    estado_clave:     string?
    activo:           bool?
    q:                string?
    page: int  per_page: int

GET    /admin/usuarios/{id}
POST   /admin/usuarios
  body:
    username:         string  # required
    email:            string  # required
    password_inicial: string  # required (usuario cambia en primer acceso)
    rol_id:           int     # required
    unidad_medica_id: uuid?
    jurisdiccion_id:  int?
    estado_clave:     string?
    nombre:           string?
    cedula_profesional: string?
    especialidad:     string?
    mfa_habilitado:   bool    # default false
  response 201:
    id:     uuid
    # Envía email de verificación automáticamente

PATCH  /admin/usuarios/{id}
  body:
    rol_id:               int?
    unidad_medica_id:     uuid?
    jurisdiccion_id:      int?
    activo:               bool?
    mfa_habilitado:       bool?
    requiere_cambio_pwd:  bool?
    nombre:               string?

POST   /admin/usuarios/{id}/desbloquear
  # Desbloquear cuenta por intentos fallidos
  response 204:

GET    /admin/roles
GET    /admin/roles/{id}/permisos
GET    /admin/permisos

# =============================================================================
# MÓDULO 10 — AUDITORÍA
# Permisos: AUDITORIA_VER, AUDITORIA_EXPORTAR
# =============================================================================

GET /admin/auditoria
  query:
    usuario_id:       uuid?
    accion:           string?   # enum tipo_accion
    modulo:           string?
    tabla_afectada:   string?
    registro_id:      uuid?
    ip_origen:        string?
    resultado:        string?   # "OK"|"ERROR"|"DENEGADO"
    desde:            datetime?
    hasta:            datetime?
    page: int  per_page: int
  response 200:
    data:   [AuditLog]
    total:  int

GET /admin/auditoria/{id}
  # Detalle de un registro de auditoría con datos_anteriores y datos_nuevos

# =============================================================================
# MÓDULO 11 — INTEROPERABILIDAD HL7 FHIR R4
# Base path: /fhir  (cumple FHIR RESTful API spec)
# Seguridad: mismo JWT + scopes SMART on FHIR
# =============================================================================
# Scopes SMART:
#   patient/*.read         — leer todos los recursos del paciente
#   patient/Immunization.write — registrar vacunas
#   system/*.read          — acceso de sistema (interop institucional)
# =============================================================================

GET /fhir/metadata
  # [PUBLIC] CapabilityStatement — describe las capacidades FHIR del servidor
  response 200:
    resourceType:   "CapabilityStatement"
    status:         "active"
    fhirVersion:    "4.0.1"
    format:         ["application/fhir+json"]
    rest:
      - mode: "server"
        resource:
          - type: "Patient"       # Paciente
            interaction: [read, search-type, create, update]
          - type: "Immunization"  # Vacuna aplicada
            interaction: [read, search-type, create, update]
          - type: "ImmunizationRecommendation"  # Esquema pendiente
            interaction: [read, search-type]
          - type: "Observation"   # Somatometría, tamizajes
            interaction: [read, search-type, create]
          - type: "Practitioner"  # Profesional de salud
            interaction: [read, search-type]
          - type: "Organization"  # Unidad médica
            interaction: [read, search-type]
          - type: "AuditEvent"    # Bitácora de auditoría
            interaction: [read, search-type]

