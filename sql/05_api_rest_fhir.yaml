# ── FHIR Immunization (mapeo de sncev.vacuna_aplicada) ───────────────────────

GET /fhir/Immunization/{id}
  response 200:
    resourceType:   "Immunization"
    id:             uuid
    status:         "completed" | "not-done"
    vaccineCode:
      coding:
        - system:   "http://hl7.org/fhir/sid/cvx"
          code:     "19"          # CVX code
          display:  "BCG"
      text:         "BCG (Bacilo de Calmette-Guérin)"
    patient:
      reference:    "Patient/{uuid}"
    occurrenceDateTime: "2024-01-15"
    primarySource:  true
    lotNumber:      "L12345A"
    expirationDate: "2025-06-30"
    site:
      coding:
        - system:   "http://snomed.info/sct"
          code:     "368209003"   # Brazo derecho
    route:
      coding:
        - system:   "http://terminology.hl7.org/CodeSystem/v3-RouteOfAdministration"
          code:     "IM"
    doseQuantity:
      value:        0.5
      unit:         "mL"
    performer:
      - actor:
          reference: "Practitioner/{uuid}"
    location:
      reference: "Organization/{uuid}"    # Unidad médica
    note:
      - text: "observaciones"

GET /fhir/Immunization
  query:
    patient:        uuid?   # "Patient/{uuid}" o solo uuid
    vaccine-code:   string? # CVX code
    date:           string? # "ge2024-01-01&date=le2024-12-31"
    status:         string?
    _count:         int?
  response 200:
    resourceType:   "Bundle"
    type:           "searchset"
    total:          int
    entry:          [{ resource: Immunization }]

POST /fhir/Immunization
  # Registrar dosis desde sistema externo — scope: patient/Immunization.write
  body: # FHIR Immunization resource JSON
  response 201:
    resourceType:   "Immunization"
    id:             uuid

# ── FHIR ImmunizationRecommendation (esquema pendiente) ──────────────────────

GET /fhir/ImmunizationRecommendation
  query:
    patient: uuid?  # required
  response 200:
    resourceType:   "Bundle"
    type:           "searchset"
    entry:
      - resource:
          resourceType:   "ImmunizationRecommendation"
          patient:        { reference: "Patient/{uuid}" }
          date:           datetime
          recommendation:
            - vaccineCode:
                coding: [{ system: "http://hl7.org/fhir/sid/cvx", code: "19" }]
              targetDisease:
                coding: [{ system: "http://snomed.info/sct", code: "56717001" }]
              forecastStatus:
                coding: [{ code: "due", display: "Pendiente" }]
              dateCriterion:
                - code:   { coding: [{ code: "30981-5" }] }  # Fecha óptima
                  value:  "2024-03-01"
                - code:   { coding: [{ code: "59778-1" }] }  # Fecha límite
                  value:  "2024-09-01"
              series:       "D2"
              doseNumber:   "2"
              seriesDoses:  "3"

# ── FHIR Observation (somatometría y tamizajes) ───────────────────────────────

POST /fhir/Observation
  # Registrar peso, talla, PC o resultado de tamiz
  body:
    resourceType:   "Observation"
    status:         "final"
    category:
      - coding: [{ system: "...", code: "vital-signs" }]
    code:
      coding:
        - system:   "http://loinc.org"
          code:     "29463-7"    # Peso corporal
          display:  "Body weight"
    subject:
      reference:    "Patient/{uuid}"
    effectiveDateTime: "2024-01-15"
    valueQuantity:
      value:        8.5
      unit:         "kg"
      system:       "http://unitsofmeasure.org"
      code:         "kg"

# Códigos LOINC usados:
# 29463-7  Peso corporal
# 8302-2   Talla
# 9843-4   Perímetro cefálico
# 39156-5  IMC
# 57700-7  Tamiz neonatal metabólico
# 54111-0  Tamiz auditivo neonatal

# ── FHIR AuditEvent (bitácora FHIR) ──────────────────────────────────────────

GET /fhir/AuditEvent
  query:
    entity:         uuid?     # registro_id
    agent:          uuid?     # usuario_id
    date:           string?
    action:         string?   # "C"|"R"|"U"|"D"|"E"
    outcome:        string?   # "0"=OK "8"=Error
  response 200:
    resourceType:   "Bundle"
    entry:
      - resource:
          resourceType:   "AuditEvent"
          type:
            system:       "http://terminology.hl7.org/CodeSystem/audit-event-type"
            code:         "rest"
          action:         "C"       # Create/Read/Update/Delete/Execute
          recorded:       datetime
          outcome:        "0"       # 0=OK, 4=MinorFail, 8=SeriousFail
          agent:
            - who:        { reference: "Practitioner/{uuid}" }
              requestor:  true
              network:    { address: "192.168.1.1", type: "2" }
          source:
            site:         "SNCEV-API"
          entity:
            - what:       { reference: "Immunization/{uuid}" }
              role:        { code: "4", display: "Domain Resource" }

# =============================================================================
# MÓDULO 12 — MODO OFFLINE (App 1 móvil)
# Para operación en campo sin conectividad
# =============================================================================

POST /sync/push
  # Subir registros capturados offline (lote)
  body:
    device_id:      string
    last_sync_at:   datetime
    registros:
      - tipo:       "vacuna_aplicada"|"cita"|"somatometria"|"paciente"
        accion:     "INSERT"|"UPDATE"
        datos:      object      # payload del registro
        local_id:   string      # ID temporal generado en dispositivo
        ts_local:   datetime    # timestamp de la operación en dispositivo
  response 200:
    procesados:   int
    errores:
      - local_id:   string
        error:      string
    id_mapping:   { local_id: uuid_servidor }   # para actualizar SQLite local

GET /sync/pull
  # Descargar cambios desde el servidor (delta sync)
  query:
    device_id:        string    # required
    last_sync_at:     datetime  # desde cuándo
    unidad_medica_id: uuid?
  response 200:
    hasta:          datetime
    pacientes:      [PacienteResumen]   # nuevos o modificados
    vacunas:        [VacunaAplicada]
    catalogos:
      vacunas:      [VacunaCatalogo]    # si hubo cambios desde last_sync_at
      esquemas:     [EsquemaVacunacion]
    citas:          [Cita]

# =============================================================================
# CÓDIGOS DE RESPUESTA COMUNES
# =============================================================================
# 200 OK              — lectura o actualización exitosa
# 201 Created         — creación exitosa (incluye Location header)
# 202 Accepted        — job asíncrono aceptado
# 204 No Content      — operación exitosa sin cuerpo de respuesta
# 400 Bad Request     — datos inválidos (body con errores de validación)
# 401 Unauthorized    — token ausente o expirado
# 403 Forbidden       — token válido pero sin permiso para la operación
# 404 Not Found       — recurso no existe o no visible por RLS
# 409 Conflict        — duplicado (ej: CURP ya registrado)
# 422 Unprocessable   — datos con error de negocio (ej: dosis fuera de esquema)
# 423 Locked          — cuenta bloqueada por intentos fallidos
# 429 Too Many Req.   — rate limit excedido
# 500 Internal Error  — error del servidor (no exponer detalle en producción)

# =============================================================================
# HEADERS OBLIGATORIOS EN TODAS LAS RESPUESTAS
# =============================================================================
# Content-Type:              application/json (REST) | application/fhir+json (FHIR)
# X-Request-ID:              UUID para correlación con logs
# X-Content-Type-Options:    nosniff
# X-Frame-Options:           DENY
# Strict-Transport-Security: max-age=31536000; includeSubDomains
# Cache-Control:             no-store (para endpoints con datos clínicos)
# X-Rate-Limit-Remaining:    int
# X-Rate-Limit-Reset:        Unix timestamp

# =============================================================================
# RATE LIMITS
# =============================================================================
# /auth/login               → 10 req/min por IP
# /auth/refresh             → 30 req/min por usuario
# /fhir/**                  → 500 req/min por token (interop institucional)
# /reportes/exportar        → 5 req/hora por usuario
# Resto de endpoints        → 300 req/min por token
