# =============================================================================
# SNCEV — docker-compose de desarrollo/prueba local
#
# Servicios: db (PostgreSQL 16, con el DDL cargado automáticamente al crear el
# volumen por primera vez), api (FastAPI), jobs (cálculo nocturno de cobertura).
#
# Primer arranque:
#   1. cp sncev_api/.env.example sncev_api/.env
#   2. python3 -c "import secrets; print(secrets.token_hex(32))"  (x2, para AES_KEY_HEX y HASH_PEPPER_HEX)
#   3. Pegar esos valores en sncev_api/.env
#   4. docker compose run --rm api python scripts/generar_claves.py /app/certs
#   5. docker compose up -d
#   6. docker compose run --rm api python -m scripts.crear_usuario --username admin \
#        --email admin@salud.gob.mx --rol "Administrador Nacional"
#   7. Abrir http://localhost:8000/docs
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sncev_db
      POSTGRES_USER: postgres          # superusuario de instalación; la app usa el rol sncev_app
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_local_only}
    volumes:
      - sncev_db_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d solo se ejecuta si el volumen está vacío (primer arranque).
      # Los scripts usan \ir (include relativo), así que el orden alfabético 00_ los encadena.
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"                    # cómodo para depurar con psql/DBeaver desde el host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sncev_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./sncev_api
    restart: unless-stopped
    env_file:
      - ./sncev_api/.env
    environment:
      # Sobrescribe lo que el .env traiga para localhost: dentro de compose la BD se
      # llama "db", no "localhost".
      DATABASE_URL: postgresql://sncev_app:${SNCEV_APP_DB_PASSWORD:-CAMBIAR_EN_PRODUCCION}@db:5432/sncev_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - sncev_certs:/app/certs
      - sncev_storage:/app/storage

  jobs:
    build:
      context: ./sncev_jobs
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sncev_db
      DB_USER: sncev_app
      DB_PASSWORD: ${SNCEV_APP_DB_PASSWORD:-CAMBIAR_EN_PRODUCCION}
      DB_SSLMODE: disable
      ENTORNO: desarrollo
      META_COBERTURA_PCT: "95"
      UMBRAL_ALERTA_PCT: "80"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9090:9090"                    # métricas Prometheus del scheduler de jobs

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"                      # Interfaz web de la Cartilla Electrónica en http://localhost:3000
    depends_on:
      - api

volumes:
  sncev_db_data:
  sncev_certs:
  sncev_storage:
